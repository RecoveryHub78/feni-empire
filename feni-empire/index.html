<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>FeNi Empire — Карта Империи</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0e0f11" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FeNi Empire" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ===== HUD: верхний пульт ===== -->
    <header class="hud">
      <div class="hud-head">
        <div class="brand">
          <span class="brand-mark">Fe<b>Ni</b></span>
          <span class="brand-name">Empire</span>
        </div>
        <div class="turn">ХОД <b id="turn">1</b></div>
      </div>

      <div class="gauges">
        <div class="gauge">
          <span class="gauge-label">Капитал</span>
          <span class="gauge-well"><span class="gauge-value" id="capital">$ 1,000,000</span></span>
        </div>
        <div class="gauge">
          <span class="gauge-label">Цена никеля <small id="nickel-delta">▲ 0.00%</small></span>
          <span class="gauge-well"><span class="gauge-value" id="nickel">$ 16,000</span></span>
        </div>
        <div class="gauge gauge--level">
          <span class="gauge-label">Уровень</span>
          <span class="gauge-well">
            <span class="gauge-value" id="level">1</span>
            <span class="xp"><i id="xp"></i></span>
          </span>
        </div>
      </div>

      <div class="res-row">
        <span class="res"><i class="res-ico res-ico--ore"></i>Руда <b id="res-ore">0</b></span>
        <span class="res"><i class="res-ico res-ico--feni"></i>FeNi <b id="res-feni">0</b></span>
        <span class="res res--smelt" id="res-smelt-wrap"><i class="res-ico res-ico--fire"></i>Плавка <b id="res-smelt">—</b></span>
      </div>
    </header>

    <!-- ===== КАРТА ===== -->
    <main class="stage">
      <canvas id="game" aria-label="Изометрическая карта империи"></canvas>
      <button id="fit-btn" class="fit-btn" type="button" aria-label="Показать всю карту">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <div class="hint">Щипок — масштаб · палец — сдвиг</div>
    </main>

    <!-- ===== НИЖНЯЯ ПАНЕЛЬ ===== -->
    <footer class="controls">
      <button id="next-btn" class="btn-metal" type="button">
        <span class="btn-led"></span>
        <span>Следующий шаг</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </footer>
  </div>

  <!-- Карточка узла / события (bottom sheet) -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-panel">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <div>
          <div class="sheet-kicker" id="sheet-kicker">Узел</div>
          <h2 class="sheet-title" id="sheet-title">—</h2>
        </div>
        <button class="sheet-close" id="sheet-close" type="button" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="main.js"></script>
</body>
</html>
