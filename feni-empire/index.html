<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>FeNi Empire</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0e0f11" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FeNi Empire" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ===== HUD: объёмные кнопки-индикаторы ===== -->
    <header class="hud">
      <div class="hud-head">
        <div class="brand"><span class="brand-mark">Fe<b>Ni</b></span><span class="brand-name">Empire</span></div>
        <div class="live"><i></i>LIVE</div>
      </div>
      <div class="hud-grid">
        <button class="hud-btn hud-btn--wide" type="button" data-open="port">
          <span class="hud-label">Капитал</span>
          <span class="hud-value" id="hud-capital">$ 150,000</span>
        </button>
        <button class="hud-btn" type="button" data-open="mine">
          <span class="hud-label"><i class="dot dot--ore"></i>Рудник</span>
          <span class="hud-value" id="hud-ore">0</span>
        </button>
        <button class="hud-btn" type="button" data-open="plant">
          <span class="hud-label"><i class="dot dot--feni"></i>FeNi</span>
          <span class="hud-value" id="hud-feni">0</span>
        </button>
        <button class="hud-btn" type="button" data-open="port">
          <span class="hud-label">Уровень</span>
          <span class="hud-value hud-value--amber" id="hud-level">1</span>
        </button>
      </div>
    </header>

    <!-- ===== КАРТА ===== -->
    <main class="stage">
      <canvas id="game" aria-label="Карта империи"></canvas>
      <div class="loading">Загрузка карты…</div>
      <button id="fit-btn" class="fit-btn" type="button" aria-label="Вернуть вид">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </main>

    <!-- ===== НИЖНЯЯ СТРОКА СТАТУСА ===== -->
    <footer class="statusbar">
      <div class="sb-item"><span>Никель</span><b id="bar-price">$ 16,000</b><small id="bar-delta">▲ 0.00%</small></div>
      <div class="sb-item"><span>Выручка / мин</span><b id="bar-income">$ 0</b></div>
      <div class="sb-item"><span>Судно</span><b id="bar-ship">У причала</b></div>
    </footer>
  </div>

  <!-- ===== КАРТОЧКА ЗДАНИЯ ===== -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="card-title">
    <div class="sheet-panel">
      <div class="sheet-grip"></div>
      <div class="card-head">
        <div class="card-thumb"><img id="card-img" alt="" /></div>
        <div class="card-titles">
          <div class="card-kicker" id="card-kicker">—</div>
          <h2 class="card-title"><span id="card-title">—</span> <span class="card-level" id="card-level">Ур. 1</span></h2>
        </div>
        <button class="card-close" id="card-close" type="button" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="card-body" id="card-body"></div>
      <button class="btn-ghost" id="btn-reset" type="button">Новая игра</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="main.js"></script>
</body>
</html>
